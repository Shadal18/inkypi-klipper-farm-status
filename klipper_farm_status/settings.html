<style>
  .floatingchat-container-wrap,
  .floating-chat-kofi-popup-iframe {
    left: unset !important;
    right: 16px !important;
  }

  .floatingchat-container-wrap {
    bottom: 14px !important;
  }

  .floating-chat-kofi-popup-iframe {
    bottom: 76px !important;
  }
</style>

<script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const defaults = {
      title: "Klipper Farm",
      printer_1_name: "K1 Max",
      printer_1_url: "http://k1max.lan:7125",
      printer_1_enabled: "true",
      printer_2_name: "AD5X",
      printer_2_url: "http://ad5x.lan:7125",
      printer_2_enabled: "true",
      show_progress: "true",
      show_filename: "true",
      show_eta: "true",
      show_layers: "true",
      show_temps: "true",
      show_spool: "true",
      show_spool_vendor: "true",
      show_spool_material: "true",
      show_spool_remaining: "true",
      show_message: "true",
    }

    Object.keys(defaults).forEach((key) => {
      const el = document.getElementById(key)
      if (!el) return

      if (typeof loadPluginSettings !== "undefined" && loadPluginSettings) {
        el.value = pluginSettings[key] || defaults[key]
      } else {
        el.value = defaults[key]
      }
    })

    if (typeof kofiWidgetOverlay !== "undefined") {
      kofiWidgetOverlay.draw("shadal", {
        type: "floating-chat",
        "floating-chat.donateButton.text": "I ❤️ Coffee",
        "floating-chat.donateButton.background-color": "#00b9fe",
        "floating-chat.donateButton.text-color": "#fff",
      })
    }
  })
</script>
