<div class="form-group">
  <label for="title" class="form-label">Header Text:</label>
  <input type="text" id="title" name="title" placeholder="Klipper Farm" class="form-input" />
</div>

<input type="hidden" id="printers_json" name="printers_json" />

<hr style="border: 0; border-top: 1px solid rgba(0, 0, 0, 0.12); margin: 20px 0 18px" />

<div class="form-group">
  <div
    style="
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      margin-bottom: 10px;
    "
  >
    Printers
  </div>

  <div id="printers_container" class="printers-container"></div>

  <button
    type="button"
    id="add_printer_btn"
    class="form-input"
    style="margin-top: 12px; cursor: pointer; font-weight: 700; background: #f8f9fa; border: 1px dashed #b9c0c7"
  >
    + Add Printer
  </button>
</div>

<hr style="border: 0; border-top: 1px solid rgba(0, 0, 0, 0.12); margin: 20px 0 18px" />

<div class="form-group">
  <label for="show_progress" class="form-label">Show Progress:</label>
  <select id="show_progress" name="show_progress" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_filename" class="form-label">Show File Name:</label>
  <select id="show_filename" name="show_filename" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_eta" class="form-label">Show ETA:</label>
  <select id="show_eta" name="show_eta" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_layers" class="form-label">Show Layers:</label>
  <select id="show_layers" name="show_layers" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_temps" class="form-label">Show Temperatures:</label>
  <select id="show_temps" name="show_temps" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_spool" class="form-label">Show Active Spool:</label>
  <select id="show_spool" name="show_spool" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_spool_vendor" class="form-label">Show Spool Brand:</label>
  <select id="show_spool_vendor" name="show_spool_vendor" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_spool_material" class="form-label">Show Spool Material:</label>
  <select id="show_spool_material" name="show_spool_material" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_spool_remaining" class="form-label">Show Spool Remaining:</label>
  <select id="show_spool_remaining" name="show_spool_remaining" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<div class="form-group">
  <label for="show_message" class="form-label">Show Status Message:</label>
  <select id="show_message" name="show_message" class="form-input">
    <option value="true">Yes</option>
    <option value="false">No</option>
  </select>
</div>

<hr style="border: 0; border-top: 1px solid rgba(0, 0, 0, 0.12); margin: 24px 0 18px" />

<div class="form-group" style="margin-bottom: 20px">
  <div
    style="
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      margin-bottom: 10px;
    "
  >
    Plugin Repository
  </div>

  <div style="background: #f8f9fa; border: 1px solid #dcdfe3; border-radius: 10px; padding: 14px 16px; min-width: 0">
    <a
      href="https://github.com/shadal18/inkypi-klipper-farm-status"
      target="_blank"
      rel="noopener noreferrer"
      style="
        color: #0d6efd;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        word-break: break-word;
        display: inline-block;
        margin-bottom: 6px;
      "
    >
      github.com/shadal18/inkypi-klipper-farm-status
    </a>

    <div style="font-size: 0.9rem; color: #666">Setup help, updates, release notes, and source code.</div>
  </div>
</div>

<style>
  .printers-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
    width: 100%;
  }

  .printer-card {
    border: 1px solid #dcdfe3;
    border-radius: 10px;
    background: #f8f9fa;
    padding: 14px;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .printer-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    min-width: 0;
  }

  .printer-card-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #444;
    min-width: 0;
    flex: 1 1 auto;
  }

  .remove-printer-btn {
    border: 0;
    background: #dc3545;
    color: #fff;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: 700;
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .floatingchat-container-wrap,
  .floating-chat-kofi-popup-iframe {
    left: unset !important;
    right: 16px !important;
  }

  .floatingchat-container-wrap {
    bottom: 14px !important;
  }

  .floating-chat-kofi-popup-iframe {
    bottom: 76px !important;
  }
</style>

<script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const defaults = {
      title: "Klipper Farm",
      show_progress: "true",
      show_filename: "true",
      show_eta: "true",
      show_layers: "true",
      show_temps: "true",
      show_spool: "true",
      show_spool_vendor: "true",
      show_spool_material: "true",
      show_spool_remaining: "true",
      show_message: "true",
    }

    const printerDefaults = [
      { name: "K1 Max", url: "http://k1max.local:7125", enabled: true },
      { name: "AD5X", url: "http://ad5x.local:7125", enabled: true },
    ]

    const printersContainer = document.getElementById("printers_container")
    const printersJsonInput = document.getElementById("printers_json")
    const addPrinterBtn = document.getElementById("add_printer_btn")

    function syncPrintersJson() {
      const cards = printersContainer.querySelectorAll(".printer-card")
      const printers = Array.from(cards).map((card) => ({
        name: card.querySelector(".printer-name-input")?.value?.trim() || "",
        url: card.querySelector(".printer-url-input")?.value?.trim() || "",
        enabled: (card.querySelector(".printer-enabled-input")?.value || "true") === "true",
      }))
      printersJsonInput.value = JSON.stringify(printers)
    }

    function refreshPrinterTitles() {
      printersContainer.querySelectorAll(".printer-card").forEach((card, index) => {
        const title = card.querySelector(".printer-card-title")
        if (title) title.textContent = `Printer ${index + 1}`
      })
    }

    function createPrinterCard(printer = {}, index = 0) {
      const card = document.createElement("div")
      card.className = "printer-card"

      card.innerHTML = `
        <div class="printer-card-header">
          <div class="printer-card-title">Printer ${index + 1}</div>
          <button type="button" class="remove-printer-btn">Remove</button>
        </div>

        <div class="form-group">
          <label class="form-label">Printer Name:</label>
          <input
            type="text"
            class="form-input printer-name-input"
            placeholder="K1 Max"
            value="${printer.name || ""}"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Moonraker URL:</label>
          <input
            type="text"
            class="form-input printer-url-input"
            placeholder="http://printer.local:7125"
            value="${printer.url || ""}"
          />
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">Enabled:</label>
          <select class="form-input printer-enabled-input">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
      `

      const enabledInput = card.querySelector(".printer-enabled-input")
      enabledInput.value = printer.enabled === false ? "false" : "true"

      card.querySelector(".remove-printer-btn").addEventListener("click", () => {
        card.remove()
        refreshPrinterTitles()
        syncPrintersJson()
      })

      card.querySelectorAll("input, select").forEach((el) => {
        el.addEventListener("input", syncPrintersJson)
        el.addEventListener("change", syncPrintersJson)
      })

      printersContainer.appendChild(card)
      syncPrintersJson()
    }

    Object.keys(defaults).forEach((key) => {
      const el = document.getElementById(key)
      if (!el) return

      if (typeof loadPluginSettings !== "undefined" && loadPluginSettings) {
        el.value = pluginSettings[key] || defaults[key]
      } else {
        el.value = defaults[key]
      }
    })

    let printers = printerDefaults

    if (typeof loadPluginSettings !== "undefined" && loadPluginSettings) {
      if (pluginSettings.printers_json) {
        try {
          const parsed = JSON.parse(pluginSettings.printers_json)
          if (Array.isArray(parsed) && parsed.length) {
            printers = parsed
          }
        } catch (e) {}
      }
    }

    printersContainer.innerHTML = ""
    printers.forEach((printer, index) => createPrinterCard(printer, index))
    refreshPrinterTitles()
    syncPrintersJson()

    addPrinterBtn.addEventListener("click", () => {
      createPrinterCard(
        { name: "", url: "", enabled: true },
        printersContainer.querySelectorAll(".printer-card").length,
      )
      refreshPrinterTitles()
      syncPrintersJson()
    })

    if (typeof kofiWidgetOverlay !== "undefined") {
      kofiWidgetOverlay.draw("shadal", {
        type: "floating-chat",
        "floating-chat.donateButton.text": "I ❤️ Coffee",
        "floating-chat.donateButton.background-color": "#00b9fe",
        "floating-chat.donateButton.text-color": "#fff",
      })
    }
  })
</script>
